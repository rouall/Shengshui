<body class="min-h-screen text-white">

  <main class="px-6 md:px-10 py-14 md:py-16 max-w-7xl mx-auto">

      <div>
        <div class="text-[11px] tracking-[0.55em] uppercase text-white/55 mb-4">Products</div>
        <h1 class="hero-title text-3xl md:text-5xl leading-tight" data-i18n="productsPage.heading">发现每一滴的价值</h1>
      </div>
    </div>

    <section>
      <div id="status" class="text-sm text-white/60"></div>
      <div id="grid" class="mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

  <footer class="px-6 md:px-10 py-10 text-center text-xs tracking-widest text-white/35">
    Copyright ©2025 Shengshui All Rights Reserved.
  </footer>

  <script>
    const gridEl = document.getElementById('grid');

    function safeUrl(url) {
      const u = String(url || '').trim();
      if (!u) return '';
      // allow http(s) and relative
      if (/^(https?:\/\/)/i.test(u) || u.startsWith('./') || u.startsWith('/') ) return u;
      // if looks like domain, prefix https
      if (/^[\w.-]+\.[a-z]{2,}/i.test(u)) return 'https://' + u;
      return u;
    }

    function render(items) {
      gridEl.innerHTML = '';
      const shown = items.slice(0, 9);


      for (const item of shown) {
        const a = document.createElement('a');
        a.href = item.url || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'lux-card group rounded-3xl overflow-hidden transition duration-500 hover:-translate-y-1';

        const img = item.image
          ? `<img src="${item.image}" alt="${(item.name || '').replace(/\"/g,'')}" class="w-full h-full object-cover opacity-95 group-hover:opacity-100 transition duration-700" loading="lazy" />`
          : `<div class="w-full h-full flex items-center justify-center text-white/35 text-xs tracking-[0.25em] uppercase">No Image</div>`;

        a.innerHTML = `
          <div class="relative aspect-[4/3] img-shell">
            <div class="absolute inset-0">${img}</div>
            <div class="absolute inset-0 bg-gradient-to-t from-black/55 via-black/10 to-transparent"></div>
          </div>
          <div class="p-7">
            <div class="text-[11px] tracking-[0.45em] uppercase text-white/45">Collection</div>
            <div class="mt-3 text-xl tracking-wide text-white/95">${item.name || 'Untitled'}</div>
            ${item.desc ? `<div class="mt-3 text-sm text-white/55 leading-relaxed line-clamp-2">${item.desc}</div>` : `<div class="mt-3 text-sm text-white/30">&nbsp;</div>`}
            <div class="mt-6 flex items-center justify-between">
              <div class="text-sm tracking-[0.25em] text-white/70">&nbsp;</div>
              <div class="text-[11px] tracking-[0.35em] uppercase text-white/55 group-hover:text-white/85 transition">View</div>
            </div>
          </div>
        `;

        if (!item.url) {
          a.addEventListener('click', (e) => {
            e.preventDefault();
          });
          a.style.cursor = 'default';
        }

        gridEl.appendChild(a);
      }
    }

    function isProduct(x) {
      return x && typeof x === 'object' && ('name' in x || 'image' in x || 'url' in x || 'desc' in x);
    }

    // PRODUCTS_DATA_START
    const PRODUCTS = [
      {
        "name": "百岁山天然矿泉水",
        "image": "https://img.alicdn.com/i3/725677994/O1CN01zQmuFn28vJ9EJ6d08_!!725677994.jpg",
        "desc": "1L*30瓶饮用水大瓶家用健康",
        "url": "https://m.tb.cn/h.7emj0hP"
      },
      {
        "name": "依能锌强化苏打水",
        "image": "https://img.alicdn.com/i2/6000000001099/O1CN01xA2Wwq1JzO99l06Hg_!!6000000001099-2-at.png",
        "desc": "饮料整箱0糖0脂0卡非气泡水无糖弱碱",
        "url": "https://m.tb.cn/h.7edhgIN"
      },
      {
        "name": "泰国进口泰象（Chang）苏打水",
        "image": "https://img.alicdn.com/i3/725677994/O1CN01cDWAkB28vJ9GqkWtL_!!725677994.jpg",
        "desc": "无糖强劲气泡水325ml*24瓶整箱",
        "url": "https://m.tb.cn/h.7VH7BO0"
      },
      {
        "name": "法国进口evian",
        "image": "https://img.alicdn.com/bao/uploaded/O1CN018Y2BwV1M3dFUkE95N_!!6000000001379-0-yinhe.jpg",
        "desc": "依云高端纯净水矿泉水330ml*24小瓶整箱",
        "url": "https://m.tb.cn/h.7VHmS1q"
      },
      {
        "name": "Perrier/巴黎水",
        "image": "https://img.alicdn.com/bao/uploaded/O1CN015N5CmL1I4JEyy9ldl_!!6000000000839-0-yinhe.jpg",
        "desc": "法国原装进口气泡水 0糖0卡原味天然矿泉水",
        "url": "https://m.tb.cn/h.7eDrGOG"
      },
      {
        "name": "怡宝饮用纯净水",
        "image": "https://img.alicdn.com/i4/6000000003306/O1CN01BOvBzL1aICO6scPyL_!!6000000003306-0-at.jpg",
        "desc": "非矿泉水桶装水家庭饮用水",
        "url": "https://m.tb.cn/h.7eDGacY"
      },
      {
        "name": "娃哈哈纯净水",
        "image": "https://img.alicdn.com/i4/6000000004888/O1CN01WIbFdd1lyl0SYBfbE_!!6000000004888-2-at.png",
        "desc": "596ml*24瓶整箱装开会出行小瓶饮用非矿泉水哇",
        "url": "https://m.tb.cn/h.7eMgOfS"
      },
      {
        "name": "三麟苏打水",
        "image": "https://img.alicdn.com/bao/uploaded/O1CN015AEJsW1xJKaDurtT5_!!6000000006422-0-yinhe.jpg",
        "desc": "经典原味0糖0卡气泡水整箱",
        "url": "https://m.tb.cn/h.7edEjrm"
      },
      {
        "name": "农夫山泉天然水",
        "image": "https://img.alicdn.com/bao/uploaded/O1CN01no9lMq22mFdNuuKky_!!6000000007162-2-yinhe.png",
        "desc": "5L*4桶*2组纸箱塑膜随机发货",
        "url": "https://m.tb.cn/h.7ex01L0"
      }
    ];
    // PRODUCTS_DATA_END

    function loadEmbedded() {
      const data = PRODUCTS;
      const items = data
        .filter(isProduct)
        .map((r) => ({
          name: String(r.name ?? '').trim(),
          image: safeUrl(String(r.image ?? '').trim()),
          desc: String(r.desc ?? '').trim(),
          url: safeUrl(String(r.url ?? '').trim())
        }))
        .filter(x => x.name || x.image || x.url);

      render(items);

      // 统计文案（随语言切换刷新）
      const statusEl = document.getElementById('status');
      if (statusEl) {
        const updateStatus = () => {
          statusEl.textContent = I18N.t.format('productsPage.status', { n: items.length, m: Math.min(items.length, 9) });
        };
        updateStatus();
        document.addEventListener('languagechange', updateStatus);
      }
    }

    loadEmbedded();
  </script>
</body>
