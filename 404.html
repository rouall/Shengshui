<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 | SHENGSHUI</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#050607">
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: #050607;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .brand {
            font-family: 'Cinzel', Georgia, serif;
            letter-spacing: 0.35em;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 3rem;
        }
        .code {
            font-family: 'Cinzel', Georgia, serif;
            font-size: clamp(72px, 18vw, 160px);
            letter-spacing: 0.15em;
            line-height: 1;
            color: rgba(255,255,255,0.92);
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .msg {
            margin-top: 1.5rem;
            font-size: 15px;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.1em;
        }
        .msg-en {
            margin-top: 0.5rem;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.08em;
        }
        .home-link {
            display: inline-block;
            margin-top: 3rem;
            padding: 14px 44px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 999px;
            transition: all 0.4s ease;
        }
        .home-link:hover {
            background: rgba(255,255,255,0.14);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.25);
            transform: translateY(-2px);
        }
        .glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(0, 210, 255, 0.06), transparent 40%),
                radial-gradient(circle at 80% 85%, rgba(255, 189, 89, 0.04), transparent 45%);
        }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>
    <main>
        <div class="brand">SHENGSHUI</div>
        <h1 class="code">404</h1>
        <p class="msg">这一滴水，流去了别处。</p>
        <p class="msg-en">This drop has flowed elsewhere.</p>
        <a href="/" class="home-link">回到首页</a>
    </main>
</body>
</html>
